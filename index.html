<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ganesha: The 21 Modaks | Festival Adventure Game</title>
  <meta name="description" content="Help Mushika prepare for Ganesh Chaturthi by clearing 5 festival mini-game challenges to collect 21 Modaks and trigger the grand celebration!">
  
  <!-- Brand Favicon & Icons -->
  <link rel="icon" type="image/jpeg" href="./src/assets/branding/ganesha-idol.jpg">
  <link rel="alternate icon" href="./src/assets/branding/ganesha-idol.jpg">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Outfit:wght@400;600;700;800&family=Rozha+One&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 & ReactDOM CDN -->
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Supabase JS Client (Zero build step) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Three.js (r160) CDN (Zero build step) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>

  <!-- Phaser 3 CDN (Zero build step) -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black overflow-hidden select-none">
  <!-- Opening Experience React Root (Intro Video -> Transition -> 21 Modaks Loader) -->
  <div id="intro-root"></div>

  <!-- Ambient 3D Three.js Background Canvas (Non-blocking, pointer-events: none) -->
  <canvas id="three-bg-canvas"></canvas>

  <!-- Main Game 3D Perspective Container -->
  <div id="game-perspective-wrapper" style="opacity: 0; pointer-events: none; transition: opacity 0.8s ease-in-out;">
    <div id="game-container">
      <div id="phaser-game"></div>
    </div>
  </div>

  <!-- Main ES Module Entry Point -->
  <script type="module" src="./src/main.js"></script>
</body>
</html>
